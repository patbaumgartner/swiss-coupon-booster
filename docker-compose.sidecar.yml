# ─────────────────────────────────────────────────────────────────────────────
# Swiss Coupon Booster – local development sidecar
#
# Starts only the patchright sidecar for local Spring Boot development.
# Used automatically by the Spring Boot Docker Compose integration when running
# `mvn spring-boot:run`, which always delegates login to the sidecar.
# ─────────────────────────────────────────────────────────────────────────────

services:
  patchright:
    build:
      context: ./patchright
    image: patbaumgartner/coupon-booster-patchright:${VERSION:-latest}
    container_name: patchright
    init: true
    restart: "no"
    environment:
      COOP_LOGIN_URL: "${COOP_LOGIN_URL:-https://www.supercard.ch/content/supercard/de.html?sso-check=1}"
      COOP_USER_DATA_DIR: /data/coop-user-data
      MIGROS_USER_DATA_DIR: /data/migros-user-data
      SCREENSHOT_DIR: /data/screenshots
      SLOW_MO_MS: "${PATCHRIGHT_SLOW_MO_MS:-500}"
      TIMEOUT_MS: "${PATCHRIGHT_TIMEOUT_MS:-25000}"
      TYPING_DELAY_MS: "${PATCHRIGHT_TYPING_DELAY_MS:-80}"
      LOG_LEVEL: "${PATCHRIGHT_LOG_LEVEL:-info}"
      # Migros passkey credential (WebAuthn). Read from the directory mounted
      # below; when the file is absent the sidecar falls back to password login.
      MIGROS_PASSKEY_FILE: /data/passkeys/migros-passkey.json
      # Optional: route through a residential proxy when needed.
      PROXY_URL: "${PROXY_URL:-}"
    volumes:
      - coop-user-data:/data/coop-user-data
      - migros-user-data:/data/migros-user-data
      - screenshots:/data/screenshots
      # Read-only mount of the directory holding the passkey secret. A DIRECTORY
      # is mounted rather than the file itself: Docker silently creates a
      # directory in its place when a bind-mounted host FILE does not exist, and
      # migros-passkey.json is git-ignored, so a fresh clone never has one.
      - ${MIGROS_PASSKEY_DIR:-./passkeys}:/data/passkeys:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  coop-user-data:
    driver: local
  migros-user-data:
    driver: local
  screenshots:
    driver: local
