[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coupon-booster-patchright"
version = "0.0.1"
requires-python = ">=3.14"
description = "Patchright stealth login sidecar for Swiss Coupon Booster"
dependencies = [
	"fastapi==0.141.1",
	"patchright==1.61.2",
	"uvicorn[standard]==0.52.1",
	"pydantic[email]==2.13.4",
]

[dependency-groups]
dev = [
	"anyio==4.14.2",
	"httpx2>=2.9.1",
	"pytest==9.1.1",
	"pytest-asyncio==1.4.0",
	"pytest-cov==7.0.0",
	"ruff==0.14.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ratchet, not an aspiration: the uncovered remainder is the async browser-driving
# flow, which needs a real Chromium. Raise this whenever coverage rises.
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=28"

[tool.coverage.run]
omit = ["test_*.py", "conftest.py", "register_migros_passkey.py"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "SIM", "BLE", "RUF"]
# S311: the random module drives human-behaviour timing jitter for bot evasion,
# which is not a cryptographic use. Every other security rule stays on.
ignore = ["S311"]
per-file-ignores = { "test_*.py" = ["S101", "S105", "S106"] }
